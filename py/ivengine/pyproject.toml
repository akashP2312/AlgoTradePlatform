[project]
name = "pmt-ivengine"
version = "0.1.0"
description = "Implied volatility, Greeks, smile fits and a rebuilt India VIX from the live option chains on the bus."
requires-python = ">=3.12,<3.13"
dependencies = [
    "nats-py>=2.9",
    "numpy>=2.0",
    "scipy>=1.14",
    "py_lets_be_rational>=1.0.1",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
ivengine = "pmt_iv.service:main"
riskengine = "pmt_iv.risksvc:main"
pmt-iv-eod = "pmt_iv.eodiv:main"
pmt-vol = "pmt_iv.vol:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmt_iv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

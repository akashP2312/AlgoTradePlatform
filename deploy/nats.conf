# NATS for the terminal: JetStream on local disk, monitoring on 8222
# (published to 127.0.0.1 only by compose).
server_name: pmt
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
max_payload: 8MB          # a full chain snapshot fits in one message
max_pending: 64MB
write_deadline: "10s"

jetstream {
  store_dir: /data
  max_memory_store: 512MB
  max_file_store: 40GB
}

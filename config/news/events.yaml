# Scheduled macro events for newsmon's risk filter. Edit freely: newsmon reloads
# this file when it changes. Nothing here is a trade signal; a timed event only
# opens a window (pmt.yaml news.windows) in which the risk state discourages new
# entries.
#
# datetime_ist: "YYYY-MM-DD HH:MM" (timed: opens the window),
#               "YYYY-MM-DD"       (date known, time not: listed, no window),
#               ""                 (date not yet confirmed: listed as TBC).
# verify: true until someone has checked the date AND time against the official
# source. Every entry starts as verify: true; never invent a date to fill a gap.
# impact: HIGH | MEDIUM | LOW. affects: NIFTY, BANKNIFTY.
#
# F&O expiries are not listed here: newsmon derives them from the listed
# instruments (news.expiries) so they track holiday shifts automatically.

events:
  # ---- RBI --------------------------------------------------------------
  - id: rbi-mpc-2026-12
    name: RBI MPC policy decision
    country: IN
    datetime_ist: "2026-12-04 10:00"
    impact: HIGH
    category: rbi_policy
    affects: [NIFTY, BANKNIFTY]
    verify: true
    source: https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=62422
    note: Date from RBI's FY27 MPC schedule; the 10:00 announcement time is customary, not stated there.

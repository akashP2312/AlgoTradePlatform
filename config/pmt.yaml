# Personal Market Terminal: Phase 0 configuration.
# ${VAR} references are expanded from the environment. Secrets (Kite API key and
# secret, Telegram token, backup recipient) are read from the environment only.

nats_url: ${NATS_URL}
database_url: ${DATABASE_URL}
data_dir: ${PMT_DATA_DIR}

kite:
  root_url: ${KITE_ROOT_URL}        # https://api.kite.trade, or fakekite in the dry run
  ws_url: ${KITE_WS_URL}            # wss://ws.kite.trade
  ws_connections: 2                 # the bot keeps the third
  tokens_per_conn: 3000
  quote_per_sec: 1
  historical_per_sec: 3
  other_per_sec: 10

# Underlyings whose option chains are recorded. index is the Kite exchange:tradingsymbol.
# wide_* sets the ticker window; core_* sets the backup recorder window (must fit in
# one 500-instrument quote call together with the indices and futures).
universe:
  underlyings:
    - name: NIFTY
      index: "NSE:NIFTY 50"
      deriv_exchange: NFO
      futures: 2
      wide_expiries: 4
      monthlies: 3                  # near, next and the one after, for the 30-day VIX across the roll
      wide_strikes: 50
      core_expiries: 3
      core_strikes: 20
      backup: true
      sweep: true
      harvest: true
    - name: BANKNIFTY
      index: "NSE:NIFTY BANK"
      deriv_exchange: NFO
      futures: 2
      wide_expiries: 3              # monthly only since November 2024
      wide_strikes: 40
      core_expiries: 3
      core_strikes: 20
      backup: true
      sweep: true
      harvest: true
  # Extra instruments streamed by the ticker, as exchange:tradingsymbol or
  # exchange:name:FUT:<n> for the nth nearest future of a name.
  extras:
    - "NSE:INDIA VIX"
    - "CDS:USDINR:FUT:1"
    - "MCX:CRUDEOIL:FUT:1"
    - "NSEIX:GIFT NIFTY"            # an index on NSE IX in Kite's list, not a future
  # NSE index constituent CSVs (niftyindices.com format); every Symbol is streamed as EQ.
  constituents:
    - config/constituents/nifty50.csv
    - config/constituents/niftybank.csv

ticker:
  recentre_steps: 10                # grow the window when spot drifts this many strikes
  stale_after: 5s                   # index and near-future silence that marks an underlying stale
  halt_after: 30s                   # every token silent, sockets up: an exchange halt (verify threshold)
  silence_reconnect: 10s            # no frames at all for this long forces a reconnect
  kv_flush: 1s

recorder:
  batch_rows: 5000
  flush_every: 1s

sweep:
  at: "15:25:00"
  underlyings: [NIFTY, BANKNIFTY]

harvest:
  lookback_days: 180                # day-one backfill depth
  window_days: 60                   # Kite allows 60 days of minute candles per call

backup:
  outbox: ${PMT_DATA_DIR}/backup/outbox
  recipient_env: PMT_BACKUP_AGE_RECIPIENT
  keep_local_days: 14

backuprec:
  out_dir: ${PMT_DATA_DIR}/backuprec
  poll_second: 20                   # poll at hh:mm:20, apart from the 15:25 sweep
  token_file: ${PMT_TOKEN_FILE}

loaders:
  user_agent: "pmt-loaders/1.0 (personal read-only market terminal; +https://github.com/akashP2312/AlgoTradePlatform)"  # honest, never a browser string
  nse_archive: https://nsearchives.nseindia.com    # verify host before relying on it
  niftyindices: https://www.niftyindices.com       # verify host before relying on it

sys:
  listen: ${PMT_SYS_LISTEN}         # 127.0.0.1:8090 or the Tailscale address only

gateway:
  listen: ${PMT_GATEWAY_LISTEN}     # 127.0.0.1:8091 or the Tailscale address only
  flush: 250ms                      # each tab gets at most one frame per window, latest value per subject
  static: web/dist                  # the built web app, served at / when present

ivengine:
  rate: 0.065                       # annual, continuous; verify against the 91-day T-bill (NSE VIX uses it)
  interval: 1s                      # recompute at most this often, and only when quotes changed
  idle_every: 10s                   # recompute anyway so time decay shows with no ticks
  max_spread: 0.30                  # drop quotes whose spread is wider than this fraction of the mid
  weekend_weight: 0.25              # trading-time weight of a non-session day (verify)
  overnight_weight: 0.25            # weight of a weekday's 15:30-09:15 gap, so books decay close to open (verify)
  forward_strikes: 5                # strikes nearest the money in the parity forward median
  vix_roll_days: 3                  # move to the next monthly pair this many days before near expiry (verify)
  calendar: config/calendar/holidays.csv

# pmt-daily (ivengine image) runs the Python EOD jobs, which the Go scheduler cannot:
# each falls due at `at` IST on a trading day, then waits for every job in `after` to
# have finished ok today, and runs once; still waiting at `until`, it is recorded as
# an error. Runs are in job_runs under the job names.
pyschedule:
  - {at: "19:05", job: iv-eod, after: [bhav]}          # iv_eod from today's bhavcopy
  - {at: "19:20", job: vol, after: [vix, spotvol]}     # rv_eod, har_eod, vol_score from index_eod
  - {at: "19:25", job: ivhist, after: [iv-eod, vol]}   # ivcm_eod, vrp_eod from iv_eod and har_eod
  - {at: "19:25", job: event, after: [iv-eod]}         # event_eod from iv_eod and index_eod
  - {at: "19:30", job: regime, after: [ivhist, vol]}   # regime_eod from vrp_eod, ivcm_eod and rv_eod

# riskengine: the book's Greeks, scenario grid and flags on risk.book. Values marked
# (verify) are placeholders until checked against the desk's own numbers.
risk:
  interval: 1s                      # reprice at most this often
  ref: NIFTY                        # delta is quoted in lots of this future
  ref_lot: 75                       # its lot size (verify against the current contract)
  spot_steps: [-10, -7, -5, -3, -2, -1, -0.5, 0.5, 1, 2, 3, 5, 7, 10]   # % moves; 0 is always added
  vol_rows: [-5, -2, 2, 5, 10]      # extra vol shifts in points on the grid; 0 is always added
  vol_cap: 2.5                      # cap on the sqrt(30/DTE) vega scaling for near expiries
  wide: 0.15                        # flag a leg whose spread is wider than this fraction of the mid
  widen: 1.0                        # stress cells pay this many extra spreads to liquidate (verify)
  stale_ms: 60000                   # flag a leg with no tick for this long
  beta_dn: -1.3                     # VIX points per 1% fall until the spotvol job measures it (verify)
  beta_up: -0.5                     # VIX points per 1% rise (verify)
  und_beta: {BANKNIFTY: 1.2}        # beta to NIFTY until measured (verify)
  # The riskmon service: minute snapshots, the day's peak and drawdown, and alerts.
  # Every figure here is a placeholder until the real capital and limits are set.
  limits:
    capital: 1000000                # the capital the percentages are of, rupees (verify)
    loss_limit: 20000               # daily loss limit on today's M2M, rupees (verify)
    loss_warn: 0.75                 # warn at this fraction of the limit; crit at 1.0 (verify)
    worst_pct: 5                    # warn when the worst grid cell (liquidation) loses more than this % of capital (verify)
    worst_move: 5                   # ...counting only cells within this % spot move, so a ±10% tail does not alarm all day (verify)
    margin_warn: 0.80               # margin used / (used + free) (verify)
    margin_crit: 0.90               # (verify)
    delta_band: 2.0                 # warn when |net delta| exceeds this many NIFTY lots (verify)
    drawdown: 0                     # warn when M2M falls this many rupees from the day's peak; 0 is off (verify)
    stale: 30s                      # crit when risk.book or book.margins stops for this long in session
    flag_after: 2m                  # warn when a flagged or unmodelled leg stays so this long

# The botmon service watches the algo-trading bot (~/algo-trading, launchd
# com.akash.algo-daily) through its SQLite ledger, mounted read-only at /bot.
# It never writes the ledger and never sends an order.
bot:
  name: rotation
  dir: /bot                         # holds ledger_<mode>.db; empty turns botmon off
  mode: paper                       # paper: the ledger is the only book, nothing to reconcile
  run_at: "18:05:00"                # the daily_eod.py run, IST, trading days only
  grace: 30m                        # warn when the run has not landed this long after run_at
  poll: 1m

news:
  # newsmon: a risk/regime filter on NEW entries, never a trade signal. The
  # scheduled-event calendar lives in config/news/events.yaml (edit it; newsmon
  # reloads it). Around each timed event the risk state reads NO_NEW_ENTRIES
  # and/or CAUTION; GET /api/risk-state serves it, news.risk streams it.
  events: config/news/events.yaml
  expiries: [NIFTY, BANKNIFTY]   # listed F&O expiries become MEDIUM "expiry" events
  expiry_at: "15:30:00"
  horizon: 2208h                 # news.events lists ~92 days ahead
  publish: 15s
  windows:                       # by impact; an impact with no entry has no window
    HIGH:   {no_entry_before: 15m, no_entry_after: 15m, caution_before: 30m, caution_after: 45m}
    MEDIUM: {caution_before: 10m, caution_after: 15m}
  categories:                    # replace the impact's window for a whole category
    expiry: {caution_before: 60m}
  feeds:
    # Headline ingestion into news.feed. Each source polls on its own with
    # conditional GETs, backoff and a circuit breaker, and only where robots.txt
    # allows. Headlines are context for the risk filter, never a trade signal.
    poll: 60s
    timeout: 15s
    user_agent: "pmt-news/0.1 (+personal RSS reader; polls every 60s)"
    keep: 200                    # headlines news.feed carries
    dedupe_ttl: 24h
    max_age: 48h
    similar: 0.8                 # title word overlap at which two sources' headlines are one story
    fails: 5                     # consecutive failures that open a source's breaker
    cool: 15m
    backoff_max: 10m
    robots: 24h
    sources:
      - {id: et_markets,  name: ET Markets,        trust: media,    region: IN, enabled: true, url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"}
      - {id: mint_markets, name: Mint Markets,     trust: media,    region: IN, enabled: true, url: "https://www.livemint.com/rss/markets"}
      - {id: bs_markets,  name: Business Standard, trust: media,    region: IN, enabled: true, url: "https://www.business-standard.com/rss/markets-106.rss"}
      - {id: rbi_press,   name: RBI press releases, trust: official, region: IN, enabled: true, url: "https://www.rbi.org.in/pressreleases_rss.xml"}
      - {id: rbi_notif,   name: RBI notifications, trust: official, region: IN, enabled: true, url: "https://www.rbi.org.in/notifications_rss.xml"}
      - {id: sebi,        name: SEBI,              trust: official, region: IN, enabled: true, url: "https://www.sebi.gov.in/sebirss.xml", note: "pubDate is a date only"}
      - {id: fed_press,   name: Fed press releases, trust: official, region: US, enabled: true, tz: America/New_York, url: "https://www.federalreserve.gov/feeds/press_all.xml"}
      - {id: fed_monetary, name: Fed monetary policy, trust: official, region: US, enabled: true, tz: America/New_York, url: "https://www.federalreserve.gov/feeds/press_monetary.xml"}
      - {id: pib_finance, name: PIB Finance,       trust: official, region: IN, enabled: false, url: "https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3",
         note: "unverified: returned Hindi items without pubDate, then empty; robots.txt is an HTML error page"}
      - {id: nse_ann,     name: NSE announcements, trust: exchange, region: IN, enabled: false, title_desc: true, url: "https://nsearchives.nseindia.com/content/RSS/Online_announcements.xml",
         note: "~370 items, mostly routine filings; title is the company, description the subject. Enable once the classifier filters it"}
      - {id: et_stocks,   name: ET Stocks,         trust: media,    region: IN, enabled: false, url: "https://economictimes.indiatimes.com/markets/stocks/rssfeeds/2146842.cms",
         note: "answered only in the first verification round"}
      - {id: paid,        name: Paid news API,     trust: media,    region: IN, enabled: false, kind: paid, note: "stub for a licensed API (Finnhub, Marketaux); never polled"}
  classify:
    # Each headline gets an impact 0-100 from config/news/rules.yaml (edit it;
    # newsmon reloads it). A fresh headline at or above caution_impact from a
    # trusted source, or from media once `corroborate` distinct sources carry it,
    # holds the risk state at CAUTION for caution_for. Never a trade signal.
    rules: config/news/rules.yaml
    caution_impact: 80
    caution_for: 10m
    trusted: [official, exchange]
    corroborate: 2
    fresh: 30m                   # published longer ago than this when seen: no hold
    tone_window: 60m             # news.feed's headline tone averages this window; display only, never the risk state
    llm:
      # Optional second opinion that can only raise an impact. Off by default;
      # needs the key in the environment variable named by key_env.
      enabled: false
      model: claude-haiku-5-5
      key_env: ANTHROPIC_API_KEY
      url: "https://api.anthropic.com/v1/messages"
      min_rule: 40               # only headlines the rules already score this high
      per_hour: 60
      timeout: 10s
  vix:
    # India VIX from the ticker's stream (it is in ticker extras). A spike holds
    # CAUTION for hold_for after the last tick that triggered it: up day_pct on
    # yesterday's close, up jump_pct on the window's low, or at level. Only
    # continuous-session ticks count, and a trigger must last `persist`.
    enabled: true
    subject: tick.nse.indiavix._._.idx
    day_pct: 15
    jump_pct: 7
    window: 15m
    level: 25
    persist: 30s
    hold_for: 15m
    stale: 2m

# Daily timetable for `jobs schedule`, IST. trading_day_only skips weekends and holidays.
schedule:
  - {at: "06:15", job: instruments, catch_up: true}
  - {at: "06:20", job: calendar, catch_up: true}
  - {at: "15:25", job: sweep, trading_day_only: true}
  - {at: "15:40", job: ivclose, trading_day_only: true}
  - {at: "15:45", job: gaps, trading_day_only: true}
  - {at: "16:15", job: merge-backup, trading_day_only: true}
  - {at: "17:30", job: harvest, trading_day_only: true}
  - {at: "19:00", job: bhav, trading_day_only: true}
  - {at: "19:05", job: partoi, trading_day_only: true}
  - {at: "19:10", job: vix, trading_day_only: true}
  - {at: "19:15", job: spotvol, trading_day_only: true}
  - {at: "19:30", job: gaps, trading_day_only: true}
  - {at: "01:30", job: backup}
